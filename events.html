<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events — Brushstrokes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Nunito:wght@400;600;700;800;900&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#5c0f20">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="bs.css">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--accent:#5c0f20;--bg:#fff9f4;--surface:#fff;--surface2:#fff3ea;--border:#e8d5c0;--text:#1a0a00;--text2:#6b4c2a;--shadow:0 2px 10px rgba(80,30,10,.08)}
    [data-theme=dark]{--bg:#1a0e08;--surface:#2a1a0e;--surface2:#3a2210;--border:#5a3a1a;--text:#f5e8d8;--text2:#c8a070}
    body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    .page{max-width:860px;margin:0 auto;padding:24px 16px 80px;animation:fadeUp .5s ease both}
    @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
    .back{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:700;font-size:.9rem;text-decoration:none;margin-bottom:20px;padding:8px 16px;border-radius:999px;background:rgba(92,15,32,.08);transition:background .15s}
    .back:hover{background:rgba(92,15,32,.14)}
    .hero{background:linear-gradient(135deg,#d4542c,#ffa270 60%,#ffd45c);border-radius:20px;padding:28px 24px;color:#fff;margin-bottom:24px;box-shadow:0 8px 24px rgba(212,84,44,.28)}
    .hero-icon{font-size:2.5rem;margin-bottom:8px}
    .hero-title{font-family:'Kaushan Script',cursive;font-size:2rem}
    .hero-sub{font-size:.88rem;opacity:.85;margin-top:4px}
    .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
    .sw{position:relative;flex:1;min-width:200px}
    .sw input{width:100%;padding:10px 14px 10px 36px;border:1.5px solid var(--border);border-radius:999px;font-size:.9rem;font-family:inherit;background:var(--surface);color:var(--text)}
    .sw input:focus{outline:none;border-color:var(--accent)}
    .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);pointer-events:none}
    .chips{display:flex;gap:6px;flex-wrap:wrap}
    .chip{padding:6px 14px;border-radius:999px;border:1.5px solid var(--border);font-size:.78rem;font-weight:700;cursor:pointer;background:var(--surface);color:var(--text2);font-family:inherit;transition:all .15s}
    .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
    .count{font-size:.82rem;color:var(--text2);font-weight:700;margin-bottom:12px}
    .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
    .card{background:var(--surface);border:1.5px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column}
    .card:hover{transform:translateY(-4px);box-shadow:0 10px 28px rgba(80,30,10,.14)}
    .card-img{width:100%;aspect-ratio:16/7;background:linear-gradient(135deg,#ffa270,#ffd45c);display:flex;align-items:center;justify-content:center;font-size:3rem;color:#fff;overflow:hidden}
    .card-img img{width:100%;height:100%;object-fit:cover}
    .card-body{padding:16px;flex:1;display:flex;flex-direction:column;gap:8px}
    .card-date{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:700;color:var(--accent);background:rgba(92,15,32,.07);padding:3px 10px;border-radius:999px;align-self:flex-start}
    .card-title{font-weight:800;font-size:1rem;line-height:1.4}
    .card-desc{font-size:.84rem;color:var(--text2);line-height:1.6;flex:1}
    .card-venue{font-size:.78rem;color:var(--text2);display:flex;align-items:center;gap:4px}
    .empty{text-align:center;padding:52px 20px;color:var(--text2);grid-column:1/-1}
    .empty-icon{font-size:3rem;margin-bottom:12px}
    .status{text-align:center;padding:60px 20px}
    .status-icon{font-size:4rem;margin-bottom:16px}
    .status-title{font-family:'Playfair Display',serif;font-size:1.5rem;margin-bottom:10px}
    .status-sub{color:var(--text2);font-size:.9rem}
  </style>
</head>
<body>
<div id="root" style="display:none">
<div class="page">
  <a class="back" href="index.html">← Back to Home</a>

  <div id="sPending" class="status" style="display:none">
    <div class="status-icon">⏳</div><div class="status-title">Approval Pending</div>
    <p class="status-sub">Events will be visible once your account is approved.</p>
  </div>
  <div id="sRejected" class="status" style="display:none">
    <div class="status-icon">❌</div><div class="status-title">Account Not Approved</div>
    <p class="status-sub">Please contact the Brushstrokes admin.</p>
  </div>

  <div id="evContent" style="display:none">
    <div class="hero">
      <div class="hero-icon">🌟</div>
      <div class="hero-title">Events</div>
      <div class="hero-sub">Upcoming and recent Brushstrokes events</div>
    </div>
    <div class="bar">
      <div class="sw"><span class="si">🔍</span><input type="text" id="searchIn" placeholder="Search events…" autocomplete="off"></div>
      <div class="chips">
        <button class="chip on" data-f="all">All</button>
        <button class="chip" data-f="upcoming">Upcoming</button>
        <button class="chip" data-f="past">Past</button>
      </div>
    </div>
    <div class="count" id="countLbl"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>
</div>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import { initializeAuth, browserSessionPersistence, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import { getFirestore as getSDb, doc, getDoc }
  from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";
import { initializeApp as initAdmin } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy }
  from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const SCFG={apiKey:"AIzaSyATW9btDBBsJg32Qcj84yEU34l1OzX5G_Q",authDomain:"brushstrokes-student.firebaseapp.com",projectId:"brushstrokes-student",storageBucket:"brushstrokes-student.firebasestorage.app",messagingSenderId:"140790604149",appId:"1:140790604149:web:18dc0eaf59d9672ce8333c"};
const ACFG={apiKey:"AIzaSyDXdAA-gK43ZC6BlspWYrB9_Yk3nO0tLnY",authDomain:"brushstrokes-cc86c.firebaseapp.com",projectId:"brushstrokes-cc86c",storageBucket:"brushstrokes-cc86c.firebasestorage.app",messagingSenderId:"684392264786",appId:"1:684392264786:web:155f9a259161c036995b8b"};
const ADMIN_UID="25Tcm6EsmDSwrznOhNwZaLMV0zg1";
const today=new Date().toISOString().slice(0,10);

const sApp = getApps().find(a=>a.name==="[DEFAULT]") || initializeApp(SCFG);
const aApp = getApps().find(a=>a.name==="admin") || initAdmin(ACFG,"admin");
const auth = initializeAuth(sApp,{persistence:browserSessionPersistence});
const sDb  = getSDb(sApp);
const aDb  = getFirestore(aApp);
const G    = id=>document.getElementById(id);

let all=[], searchQ="", filter="all";

onAuthStateChanged(auth, async user=>{
  if(!user){(window.top||window).location.href="index.html";return;}
  let u={};
  try{const s=await getDoc(doc(sDb,"users",user.uid));if(s.exists())u=s.data();}catch(_){}
  G("root").style.display="block";
  const isAdmin=user.uid===ADMIN_UID;
  if(!isAdmin){
    if(!u.status||u.status==="pending"){G("sPending").style.display="block";return;}
    if(u.status==="rejected"){G("sRejected").style.display="block";return;}
  }
  G("evContent").style.display="block";
  // Read directly from admin Firestore (public read allowed by admin rules)
  // no orderBy: a query with orderBy silently drops docs that lack that field
  onSnapshot(collection(aDb,"home_events"), snap=>{
    all=snap.docs.map(d=>({id:d.id,...d.data()}));
    all.sort((a,b)=>sortKey(b).localeCompare(sortKey(a)));
    render();
  }, err=>{
    console.error("Events listener:",err);
    G("countLbl").textContent="";
    G("grid").innerHTML=`<div class="empty"><div class="empty-icon">⚠️</div>Events load nahi hue: ${esc(err.code||err.message)}</div>`;
  });
});

G("searchIn").addEventListener("input",function(){searchQ=this.value.toLowerCase();render();});
document.querySelectorAll(".chip").forEach(c=>{
  c.addEventListener("click",()=>{
    filter=c.dataset.f;
    document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x.dataset.f===filter));
    render();
  });
});

function render(){
  let list=[...all];
  if(filter==="upcoming") list=list.filter(e=>isoOf(e)>=today);
  if(filter==="past")     list=list.filter(e=>isoOf(e)<today);
  if(searchQ) list=list.filter(e=>[(e.title||""),(e.name||""),(e.description||""),(e.venue||"")].join(" ").toLowerCase().includes(searchQ));
  G("countLbl").textContent=list.length+" event"+(list.length!==1?"s":"");
  if(!list.length){G("grid").innerHTML=`<div class="empty"><div class="empty-icon">🌟</div>No events found.</div>`;return;}
  const m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  G("grid").innerHTML=list.map(e=>{
    const iso=isoOf(e); const p=iso.split("-");
    const ds=p.length>=3?`${parseInt(p[2])} ${m[parseInt(p[1])-1]} ${p[0]}`:"";
    const isPast=iso<today;
    const photos=[].concat(e.photos||e.images||e.photo||e.image||e.imageUrl||e.poster||e.previewUrl||[]).filter(Boolean);
    return `<div class="card">
      <div class="card-img">${photos[0]?`<img src="${esc(photos[0])}" alt="${esc(e.title||e.name||"")}" loading="lazy" onerror="this.parentNode.textContent='🌟'">`:"🌟"}</div>
      <div class="card-body">
        ${ds?`<span class="card-date">📅 ${ds} · ${isPast?"Past":"Upcoming"}</span>`:""}
        <div class="card-title">${esc(e.title||e.name||e.eventName||"Event")}</div>
        ${e.description?`<div class="card-desc">${esc(e.description)}</div>`:""}
        ${e.venue?`<div class="card-venue">📍 ${esc(e.venue)}</div>`:""}
      </div>
    </div>`;
  }).join("");
}
function isoOf(e){
  let d=e.date||e.eventDate||"";
  if(d&&typeof d==="object"&&d.toDate){const x=d.toDate();return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");}
  d=String(d);
  const m=d.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
  if(m) return m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");
  return d;
}
function sortKey(e){
  const c=e.createdAt; const ms=c?(c.toMillis?c.toMillis():Number(c)||0):0;
  return (isoOf(e)||"0000-00-00")+"|"+String(ms).padStart(15,"0");
}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
</script>
<script>
/* Embedded mode: page opens inside index.html (header + Welcome stay on top) */
if (new URLSearchParams(location.search).has("embed")) {
  try { var th = localStorage.getItem("theme"); if (th === "dark" || th === "light") document.documentElement.setAttribute("data-theme", th); } catch (e) {}
  var st = document.createElement("style");
  st.textContent = ".back{display:none!important}body{background:transparent!important;min-height:0!important}.page{padding:4px 0 24px!important;animation:none!important}";
  document.head.appendChild(st);
  var sendH = function () { parent.postMessage({ bsEmbedH: document.body.offsetHeight }, location.origin); };
  window.addEventListener("load", function () { sendH(); new ResizeObserver(sendH).observe(document.body); });
}
</script>
</body>
</html>
