<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Information — Brushstrokes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Nunito:wght@400;600;700;800;900&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#5c0f20">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="bs.css">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--accent:#5c0f20;--bg:#fff9f4;--surface:#fff;--surface2:#fff3ea;--border:#e8d5c0;--text:#1a0a00;--text2:#6b4c2a;--shadow:0 2px 10px rgba(80,30,10,.08)}
    [data-theme=dark]{--bg:#1a0e08;--surface:#2a1a0e;--surface2:#3a2210;--border:#5a3a1a;--text:#f5e8d8;--text2:#c8a070}
    body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    .page{max-width:820px;margin:0 auto;padding:24px 16px 80px;animation:fadeUp .5s ease both}
    @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
    .back{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:700;font-size:.9rem;text-decoration:none;margin-bottom:20px;padding:8px 16px;border-radius:999px;background:rgba(92,15,32,.08);transition:background .15s}
    .back:hover{background:rgba(92,15,32,.14)}
    .hero{background:linear-gradient(135deg,#2569b8,#62b1f5 60%,#a8d8f8);border-radius:20px;padding:28px 24px;color:#fff;margin-bottom:24px;box-shadow:0 8px 24px rgba(37,105,184,.28)}
    .hero-icon{font-size:2.5rem;margin-bottom:8px}
    .hero-title{font-family:'Kaushan Script',cursive;font-size:2rem}
    .hero-sub{font-size:.88rem;opacity:.85;margin-top:4px}
    .bar{display:flex;gap:10px;margin-bottom:20px}
    .sw{position:relative;flex:1}
    .sw input{width:100%;padding:10px 14px 10px 36px;border:1.5px solid var(--border);border-radius:999px;font-size:.9rem;font-family:inherit;background:var(--surface);color:var(--text)}
    .sw input:focus{outline:none;border-color:var(--accent)}
    .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);pointer-events:none}
    .count{font-size:.82rem;color:var(--text2);font-weight:700;margin-bottom:14px}
    .info-list{display:flex;flex-direction:column;gap:12px}
    .info-card{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);transition:box-shadow .2s}
    .info-card:hover{box-shadow:0 6px 20px rgba(80,30,10,.12)}
    .info-hdr{display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer;user-select:none}
    .info-ico{width:40px;height:40px;border-radius:10px;flex-shrink:0;background:linear-gradient(135deg,#62b1f5,#2569b8);display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:#fff}
    .info-ttl{flex:1;font-weight:800;font-size:.95rem}
    .info-date{font-size:.75rem;color:var(--text2);flex-shrink:0}
    .info-chev{font-size:.9rem;color:var(--text2);transition:transform .25s;flex-shrink:0}
    .info-card.open .info-chev{transform:rotate(180deg)}
    .info-body{max-height:0;overflow:hidden;transition:max-height .35s ease;border-top:0 solid var(--border)}
    .info-card.open .info-body{max-height:1200px;border-top-width:1px}
    .info-inner{padding:16px 18px;font-size:.88rem;color:var(--text2);line-height:1.7}
    .info-inner img{max-width:100%;border-radius:10px;margin:10px 0;border:1px solid var(--border)}
    .empty{text-align:center;padding:52px 20px;color:var(--text2)}
    .empty-icon{font-size:3rem;margin-bottom:12px}
    .status{text-align:center;padding:60px 20px}
    .status-icon{font-size:4rem;margin-bottom:16px}
    .status-title{font-family:'Playfair Display',serif;font-size:1.5rem;margin-bottom:10px}
    .status-sub{color:var(--text2);font-size:.9rem}
  </style>
</head>
<body>
<div id="root" style="display:none">
<div class="page">
  <a class="back" href="index.html">← Back to Home</a>
  <div id="sPending" class="status" style="display:none"><div class="status-icon">⏳</div><div class="status-title">Approval Pending</div><p class="status-sub">Information will be visible once your account is approved.</p></div>
  <div id="sRejected" class="status" style="display:none"><div class="status-icon">❌</div><div class="status-title">Account Not Approved</div><p class="status-sub">Please contact the Brushstrokes admin.</p></div>
  <div id="infoContent" style="display:none">
    <div class="hero"><div class="hero-icon">ℹ️</div><div class="hero-title">Information</div><div class="hero-sub">General notices and resources from Brushstrokes</div></div>
    <div class="bar"><div class="sw"><span class="si">🔍</span><input type="text" id="searchIn" placeholder="Search information…" autocomplete="off"></div></div>
    <div class="count" id="countLbl"></div>
    <div class="info-list" id="infoList"></div>
  </div>
</div>
</div>
<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import { initializeAuth, browserSessionPersistence, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import { getFirestore as getSDb, doc, getDoc }
  from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";
import { initializeApp as initAdmin } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy }
  from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const SCFG={apiKey:"AIzaSyATW9btDBBsJg32Qcj84yEU34l1OzX5G_Q",authDomain:"brushstrokes-student.firebaseapp.com",projectId:"brushstrokes-student",storageBucket:"brushstrokes-student.firebasestorage.app",messagingSenderId:"140790604149",appId:"1:140790604149:web:18dc0eaf59d9672ce8333c"};
const ACFG={apiKey:"AIzaSyDXdAA-gK43ZC6BlspWYrB9_Yk3nO0tLnY",authDomain:"brushstrokes-cc86c.firebaseapp.com",projectId:"brushstrokes-cc86c",storageBucket:"brushstrokes-cc86c.firebasestorage.app",messagingSenderId:"684392264786",appId:"1:684392264786:web:155f9a259161c036995b8b"};
const ADMIN_UID="25Tcm6EsmDSwrznOhNwZaLMV0zg1";
const sApp=getApps().find(a=>a.name==="[DEFAULT]")||initializeApp(SCFG);
const aApp=getApps().find(a=>a.name==="admin")||initAdmin(ACFG,"admin");
const auth=initializeAuth(sApp,{persistence:browserSessionPersistence});
const sDb=getSDb(sApp); const aDb=getFirestore(aApp);
const G=id=>document.getElementById(id);
let all=[], searchQ="";

onAuthStateChanged(auth, async user=>{
  if(!user){(window.top||window).location.href="index.html";return;}
  let u={};
  try{const s=await getDoc(doc(sDb,"users",user.uid));if(s.exists())u=s.data();}catch(_){}
  G("root").style.display="block";
  const isAdmin=user.uid===ADMIN_UID;
  if(!isAdmin){
    if(!u.status||u.status==="pending"){G("sPending").style.display="block";return;}
    if(u.status==="rejected"){G("sRejected").style.display="block";return;}
  }
  G("infoContent").style.display="block";
  onSnapshot(query(collection(aDb,"info_posts"),orderBy("createdAt","desc")),snap=>{
    all=snap.docs.map(d=>({id:d.id,...d.data()}));render();
  });
});
G("searchIn").addEventListener("input",function(){searchQ=this.value.toLowerCase();render();});
function guessIcon(t){
  const s=(t||"").toLowerCase();
  if(s.includes("rule")||s.includes("policy"))return"📋";
  if(s.includes("fee")||s.includes("payment"))return"💰";
  if(s.includes("exam")||s.includes("test"))return"📝";
  if(s.includes("time")||s.includes("schedule"))return"📅";
  if(s.includes("contact")||s.includes("phone"))return"📞";
  if(s.includes("member")||s.includes("join"))return"👥";
  return"ℹ️";
}
function render(){
  let list=[...all];
  if(searchQ) list=list.filter(a=>[(a.title||""),(a.text||""),(a.body||"")].join(" ").toLowerCase().includes(searchQ));
  G("countLbl").textContent=list.length+" item"+(list.length!==1?"s":"");
  if(!list.length){G("infoList").innerHTML=`<div class="empty"><div class="empty-icon">ℹ️</div>No information posts yet.</div>`;return;}
  G("infoList").innerHTML=list.map((a,i)=>{
    const title=a.title||a.heading||"Information";
    const text=a.text||a.body||a.description||"";
    const imgs=a.images||[];
    const t=a.createdAt; const ms=t?(t.toMillis?t.toMillis():t):0;
    const ds=ms?new Date(ms).toLocaleDateString("en-IN",{dateStyle:"medium"}):"";
    return `<div class="info-card" id="ic${i}">
      <div class="info-hdr">
        <div class="info-ico">${guessIcon(title)}</div>
        <div class="info-ttl">${esc(title)}</div>
        ${ds?`<div class="info-date">${esc(ds)}</div>`:""}
        <span class="info-chev">▾</span>
      </div>
      <div class="info-body"><div class="info-inner">
        ${text?esc(text).replace(/\n/g,"<br>"):""}
        ${imgs.map(img=>`<img src="${esc(img)}" alt="info" loading="lazy">`).join("")}
        ${!text&&!imgs.length?"<em>No additional content.</em>":""}
      </div></div>
    </div>`;
  }).join("");
  document.querySelectorAll(".info-hdr").forEach(h=>{
    h.addEventListener("click",()=>{
      const card=h.closest(".info-card");
      const open=card.classList.contains("open");
      document.querySelectorAll(".info-card.open").forEach(c=>c.classList.remove("open"));
      if(!open) card.classList.add("open");
    });
  });
}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
</script>
<script>
/* Embedded mode: page opens inside index.html (header + Welcome stay on top) */
if (new URLSearchParams(location.search).has("embed")) {
  try { var th = localStorage.getItem("theme"); if (th === "dark" || th === "light") document.documentElement.setAttribute("data-theme", th); } catch (e) {}
  var st = document.createElement("style");
  st.textContent = ".back{display:none!important}body{background:transparent!important;min-height:0!important}.page{padding:4px 0 24px!important;animation:none!important}";
  document.head.appendChild(st);
  var sendH = function () { parent.postMessage({ bsEmbedH: document.body.offsetHeight }, location.origin); };
  window.addEventListener("load", function () { sendH(); new ResizeObserver(sendH).observe(document.body); });
}
</script>
</body>
</html>
